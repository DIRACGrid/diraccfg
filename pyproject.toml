[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4"]
build-backend = "setuptools.build_meta"

# Enable setuptools_scm to compute the version number from the most recent tag
# https://github.com/pypa/setuptools_scm/#pyprojecttoml-usage
[tool.setuptools_scm]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.mypy]
strict = true
files = 'src/diraccfg'

[tool.pylint."messages control"]
disable = ["unsubscriptable-object"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
# Supply-chain cooldown at solve time, matching the 7-day Renovate minimumReleaseAge
# (Renovate's lock file maintenance skips it; see DIRACGrid/.github renovate-config.json).
# The relative form needs pixi >= 0.67.0.
exclude-newer = "7d"

[tool.pixi.environments]
# `pixi run test` without `-e` uses the default environment: same as py311.
default = { features = ["testing", "py311"], solve-group = "py311" }
py39 = { features = ["testing", "py39"] }
py310 = { features = ["testing", "py310"] }
py311 = { features = ["testing", "py311"], solve-group = "py311" }

[tool.pixi.feature.py39.dependencies]
python = "3.15.*"

[tool.pixi.feature.py310.dependencies]
python = "3.15.*"

[tool.pixi.feature.py311.dependencies]
python = "3.15.*"

[tool.pixi.feature.testing.pypi-dependencies]
# pytest, pytest-cov and pylint come from setup.py's `testing` extra
diraccfg = { path = ".", editable = true, extras = ["testing"] }
mypy = "*"

[tool.pixi.tasks]
mypy = { cmd = "mypy", description = "Type-check the sources" }
pylint = { cmd = "pylint -E src/diraccfg/ tests/", description = "Run pylint" }
test = { cmd = "pytest", description = "Run the test suite" }

[tool.bandit]
exclude_dirs = [".github", "docs", "test", "tests"]
skips = [
  "B101", # assert_used - asserts are used for internal sanity checks in the parser
]
