name: CI

on: [push, pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diraccfg'
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install pre-commit
      run: pip install pre-commit
    - name: Run pre-commit
      run: pre-commit run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: False
      matrix:
        python_version:
          - "3.9"
          - "3.10"
          - "3.11"
    steps:
    - uses: actions/checkout@v3
    - name: Prepare environment
      run: .github/workflows/prepare_environment.sh ${{ matrix.python_version }}
    - name: Run pytest
      run: |
        . "${CONDA}/bin/activate" test-env
        pytest
    - name: Run mypy
      run: |
        . "${CONDA}/bin/activate" test-env
        mypy
    - name: Run pylint
      run: |
        . "${CONDA}/bin/activate" test-env
        pylint -E src/diraccfg/ tests/

  build-pypi:
    runs-on: ubuntu-latest
    name: Build package
    needs: [pytest, pre-commit]
    outputs:
      is-tag: ${{ steps.check-tag.outputs.is-tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - run: |
          git fetch --prune --unshallow
      - name: Prepare environment
        run: .github/workflows/prepare_environment.sh 3
      - name: Build distributions
        run: |
          . "${CONDA}/bin/activate" test-env
          python setup.py sdist bdist_wheel --universal
      - name: Check if this is a tag push
        id: check-tag
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') }}
        run: echo "is-tag=$IS_TAG" >> "$GITHUB_OUTPUT"
      - name: Upload the distribution packages
        if: steps.check-tag.outputs.is-tag == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diraccfg-dist
          path: dist/
          retention-days: 5

  # Only this job talks to PyPI; the build above runs without any PyPI credential.
  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish package to PyPI
    needs: build-pypi
    if: needs.build-pypi.outputs.is-tag == 'true' && needs.build-pypi.result == 'success'
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diraccfg-dist
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
