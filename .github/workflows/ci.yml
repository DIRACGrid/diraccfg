name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diraccfg'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # the pinned pre-commit hook versions (flynt 0.77, pyupgrade v3.3.1)
          # predate the removal of ast.Str in Python 3.12
          python-version: '3.11'
      # pre-commit/action is not used because it wraps actions/cache@v4 (by
      # tag, not SHA), which the organization action policy rejects
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diraccfg'
    strategy:
      fail-fast: false
      matrix:
        python-version: [py39, py310, py311]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools_scm needs the tags to compute the version
      - name: Apply workarounds
        run: |
          # Workaround for https://github.com/prefix-dev/pixi/issues/3762
          sed -i.bak 's@editable = true@editable = false@g' pyproject.toml
          rm pyproject.toml.bak
          # Show any changes
          git diff
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: false
          environments: ${{ matrix.python-version }}
      - name: Run pytest
        run: pixi run -e ${{ matrix.python-version }} pytest
      - name: Run mypy
        run: pixi run -e ${{ matrix.python-version }} mypy
      - name: Run pylint
        run: pixi run -e ${{ matrix.python-version }} pylint

  build-pypi:
    runs-on: ubuntu-latest
    name: Build package
    needs: [pytest, pre-commit]
    outputs:
      is-tag: ${{ steps.check-tag.outputs.is-tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools_scm needs the tags to compute the version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist/ .
      - name: Check if this is a tag push
        id: check-tag
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') }}
        run: echo "is-tag=$IS_TAG" >> "$GITHUB_OUTPUT"
      - name: Upload the distribution packages
        if: steps.check-tag.outputs.is-tag == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diraccfg-dist
          path: dist/
          retention-days: 5

  # Only this job talks to PyPI; the build above runs without any PyPI credential.
  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish package to PyPI
    needs: build-pypi
    if: needs.build-pypi.outputs.is-tag == 'true' && needs.build-pypi.result == 'success'
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diraccfg-dist
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
